name: Build Sonic 3 AIR ARM64

on:
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU (for ARM64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libglew-dev libglfw3-dev libtheora-dev libdrm-dev libgbm-dev git

      - name: Compile via CMake
        run: |
          cd Oxygen/sonic3air/build/_cmake
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-O3 -march=armv8-a" -DCMAKE_CXX_FLAGS="-O3 -march=armv8-a"
          cmake --build build --config Release --parallel $(nproc)

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonic3air-arm64-binary
          path: Oxygen/sonic3air/build/_cmake/build/sonic3air # Adjust if executable output is named differently
