name: Build ARM64 Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Host Cross-Compiler & Local Headers
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake libcurl4-openssl-dev

    - name: Inject Missing Curl Headers Domestically
      run: |
        # Create the local destination directory structure
        mkdir -p Oxygen/oxygenengine/source/framework/external/curl/curl
        
        # Copy the pre-installed system curl headers directly into the repository tree
        cp /usr/include/curl/*.h Oxygen/oxygenengine/source/framework/external/curl/curl/

    - name: Configure and Build CMake Project
      run: |
        cd Oxygen/sonic3air/build/_cmake
        
        # Point the include paths to our newly populated local directory structure
        cmake \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DOPENGL_opengl_LIBRARY=/dev/null \
          -DOPENGL_glx_LIBRARY=/dev/null \
          -DOPENGL_INCLUDE_DIR=/dev/null \
          -DCURL_LIBRARY=/dev/null \
          -DCURL_INCLUDE_DIR=../../oxygenengine/source/framework/external/curl \
          -DSDL_STATIC=OFF \
          -DUSE_GLES=ON .
          
        make -j$(nproc)

    - name: Upload Compiled Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sonic3air-linux-arm64
        path: Oxygen/sonic3air/build/_cmake/sonic3air
