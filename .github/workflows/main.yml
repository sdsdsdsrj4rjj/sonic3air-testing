name: Build ARM64 Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Host Cross-Compiler & Local Dev Headers
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake libsdl2-dev

    - name: Configure and Build CMake Project
      run: |
        cd Oxygen/sonic3air/build/_cmake
        
        # Inject stub definitions to clear the hardcoded Curl verification scan,
        # and disable network-dependent sub-features to avoid build runtime link errors.
        cmake \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DOPENGL_opengl_LIBRARY=stub \
          -DOPENGL_glx_LIBRARY=stub \
          -DOPENGL_INCLUDE_DIR=stub \
          -DCURL_LIBRARY=stub \
          -DCURL_INCLUDE_DIR=stub \
          -DAIR_NETWORK_FEATURES=OFF \
          -DAIR_FORCE_INTERNAL_LIBS=ON \
          -DFAUDIO_INTERNAL=ON \
          -DSDL_STATIC=OFF \
          -DUSE_GLES=ON .
          
        make -j$(nproc)

    - name: Upload Compiled Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sonic3air-linux-arm64
        path: Oxygen/sonic3air/build/_cmake/sonic3air
