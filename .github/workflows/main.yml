name: Build ARM64 Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Compile using Native Cross-Compiler Container
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace dockcross/linux-arm64-lts bash -c "
          # 1. Update package database inside toolchain container
          sudo apt-get update && \
          
          # 2. Install game engine development libraries targeting ARM64
          sudo apt-get install -y libgl1-mesa-dev:arm64 libglu1-mesa-dev:arm64 libegl1-mesa-dev:arm64 libsdl2-dev:arm64 libcurl4-openssl-dev:arm64 && \
          
          # 3. Enter CMake directory
          cd Oxygen/sonic3air/build/_cmake && \
          
          # 4. Configure using the pre-built toolchain variables provided by dockcross
          cmake \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY . && \
            
          # 5. Native speed compilation
          make -j$(nproc)
        "

    - name: Upload Compiled Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sonic3air-linux-arm64
        path: Oxygen/sonic3air/build/_cmake/sonic3air
