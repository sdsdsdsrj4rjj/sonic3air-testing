name: Build ARM64 Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Host Cross-Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake

    - name: Inject Missing Curl Headers Domestically
      run: |
        # Create an absolute target directory path inside the framework's external tree
        mkdir -p Oxygen/oxygenengine/source/framework/external/curl/curl
        
        # Download the official release headers directly into the local source layout
        curl -sL https://githubusercontent.com -o Oxygen/oxygenengine/source/framework/external/curl/curl/curl.h
        curl -sL https://githubusercontent.com -o Oxygen/oxygenengine/source/framework/external/curl/curl/curlver.h
        curl -sL https://githubusercontent.com -o Oxygen/oxygenengine/source/framework/external/curl/curl/system.h

    - name: Configure and Build CMake Project
      run: |
        cd Oxygen/sonic3air/build/_cmake
        
        # Direct include paths to point directly to our newly populated domestic folder layout
        cmake \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DOPENGL_opengl_LIBRARY=/dev/null \
          -DOPENGL_glx_LIBRARY=/dev/null \
          -DOPENGL_INCLUDE_DIR=/dev/null \
          -DCURL_LIBRARY=/dev/null \
          -DCURL_INCLUDE_DIR=../../oxygenengine/source/framework/external/curl \
          -DSDL_STATIC=OFF \
          -DUSE_GLES=ON .
          
        make -j$(nproc)

    - name: Upload Compiled Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sonic3air-linux-arm64
        path: Oxygen/sonic3air/build/_cmake/sonic3air
