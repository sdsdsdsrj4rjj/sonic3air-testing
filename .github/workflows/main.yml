name: Build Sonic 3 AIR ARM64 RG34XX

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-arm64:
    name: Build Sonic 3 AIR v26.03.28.0 for RG34XX
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Clone Sonic 3 A.I.R. v26.03.28.0
        uses: actions/checkout@v4
        with:
          repository: Eukaryot/sonic3air
          ref: v26.03.28.0-stable
          submodules: recursive
          fetch-depth: 1

      - name: Show build environment
        run: |
          uname -a
          ldd --version | head -n 1
          g++ --version | head -n 1

      - name: Patch upstream ImGui declaration
        run: |
          sed -i 's/bool ImGuiIntegration::hasBlockingImGuiWindow()  { return false; }/bool ImGuiIntegration::hasBlockingImGuiWindow() const { return false; }/'             Oxygen/oxygenengine/source/oxygen/menu/imgui/ImGuiIntegration.cpp
          grep -n 'hasBlockingImGuiWindow'             Oxygen/oxygenengine/source/oxygen/menu/imgui/ImGuiIntegration.cpp

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential             cmake             ninja-build             git             pkg-config             libsdl2-dev             libgl1-mesa-dev             libglu1-mesa-dev             libgles2-mesa-dev             libasound2-dev             libpulse-dev             libxcomposite-dev             libxxf86vm-dev             libcurl4-openssl-dev

      - name: Configure
        working-directory: Oxygen/sonic3air/build/_cmake
        run: |
          cmake -G Ninja -B build             -DUSE_GLES=ON             -DBUILD_SDL_STATIC=OFF             -DUSE_DISCORD=OFF             -DUSE_IMGUI=OFF             -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: Oxygen/sonic3air/build/_cmake
        run: |
          cmake --build build --parallel 2

      - name: Build RG34XX SDL compatibility shim
        run: |
          cat > /tmp/sonic3air_sdlshim.c <<'EOF'
          #include <stdint.h>

          typedef struct SDL_Joystick SDL_Joystick;
          typedef struct SDL_GameController SDL_GameController;

          /*
           * PortMaster's older SDL2 does not export these newer SDL2 entry points.
           * The game only needs the symbols to exist; unsupported functionality
           * gracefully reports failure.
           */
          int SDL_JoystickHasRumble(SDL_Joystick *joystick)
          {
              (void)joystick;
              return 0;
          }

          int SDL_OpenURL(const char *url)
          {
              (void)url;
              return -1;
          }

          int SDL_GameControllerSetLED(SDL_GameController *gamecontroller,
                                        unsigned char red,
                                        unsigned char green,
                                        unsigned char blue)
          {
              (void)gamecontroller;
              (void)red;
              (void)green;
              (void)blue;
              return -1;
          }
          EOF
          gcc -shared -fPIC -O2             -Wl,-soname,libsonic3air_sdlshim.so             -o Oxygen/sonic3air/libsonic3air_sdlshim.so             /tmp/sonic3air_sdlshim.c
          file Oxygen/sonic3air/libsonic3air_sdlshim.so
          readelf -Ws Oxygen/sonic3air/libsonic3air_sdlshim.so |
            grep -E 'SDL_(JoystickHasRumble|OpenURL|GameControllerSetLED)'

      - name: Verify ARM64 and RG34XX-compatible glibc
        run: |
          test -f Oxygen/sonic3air/sonic3air_linux
          file Oxygen/sonic3air/sonic3air_linux
          readelf --version-info Oxygen/sonic3air/sonic3air_linux |
            grep -E 'GLIBC_2\.|GLIBCXX_3\.4\.' |
            sort -V |
            tail -20
          if readelf --version-info Oxygen/sonic3air/sonic3air_linux |
            grep -Eq 'GLIBC_2\.(3[6-9]|[4-9][0-9])'; then
            echo "ERROR: binary requires glibc newer than the RG34XX glibc 2.35"
            exit 1
          fi

      - name: Inspect SDL imports
        run: |
          echo "Imported SDL symbols related to compatibility:"
          nm -D Oxygen/sonic3air/sonic3air_linux |
            grep -E 'SDL_(JoystickHasRumble|OpenURL|GameControllerSetLED)' || true
          echo "Provided shim symbols:"
          nm -D Oxygen/sonic3air/libsonic3air_sdlshim.so |
            grep -E 'SDL_(JoystickHasRumble|OpenURL)'

      - name: Strip binaries
        run: |
          strip Oxygen/sonic3air/sonic3air_linux
          strip Oxygen/sonic3air/libsonic3air_sdlshim.so
          file Oxygen/sonic3air/sonic3air_linux
          file Oxygen/sonic3air/libsonic3air_sdlshim.so

      - name: Upload RG34XX binary and SDL shim
        uses: actions/upload-artifact@v4
        with:
          name: sonic3air-v26.03.28-arm64-rg34xx
          path: |
            Oxygen/sonic3air/sonic3air_linux
            Oxygen/sonic3air/libsonic3air_sdlshim.so
          if-no-files-found: error
