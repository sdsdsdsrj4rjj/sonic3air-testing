name: Build Sonic 3 AIR ARM64 RG34XX
on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Toolchain & Core Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Compile via CMake
        run: |
          cd Oxygen/sonic3air/build/_cmake
          rm -rf build
          
          # Restored working configuration variables
          cmake -B build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -march=armv8-a" \
            -DCMAKE_CXX_FLAGS="-O3 -march=armv8-a" \
            -DUSE_GLES=ON \
            -DBUILD_SDL_STATIC=ON \
            -DBUILD_OXYGEN_SERVER=OFF \
            -DOPENGL_opengl_LIBRARY="/usr/lib/aarch64-linux-gnu/libGLESv2.so" \
            -DOPENGL_glx_LIBRARY="/usr/lib/aarch64-linux-gnu/libEGL.so" \
            -DOPENGL_INCLUDE_DIR="/usr/include" \
            -DCURL_LIBRARY="/usr/lib/aarch64-linux-gnu/libEGL.so" \
            -DCURL_INCLUDE_DIR="/usr/include" \
            -D_THEORA_STATIC=ON \
            -D_VORBIS_STATIC=ON \
            -D_OGG_STATIC=ON

          # Fix: Manually compile the missing object file before the archiver runs
          LEMON_SRC="$GITHUB_WORKSPACE/Oxygen/lemonscript/source/lemon/compiler"
          LEMON_OBJ="build/CMakeFiles/lemonscript.dir/$LEMON_SRC"
          mkdir -p "$LEMON_OBJ"
          aarch64-linux-gnu-gcc -O3 -march=armv8-a -c "$LEMON_SRC/TokenHelper.c" -o "$LEMON_OBJ/TokenHelper.c.o"

          # Fix the generated link file to use the object file instead of the raw C source
          if [ -f build/CMakeFiles/lemonscript.dir/link.txt ]; then
            sed -i "s|TokenHelper.c|TokenHelper.c.o|g" build/CMakeFiles/lemonscript.dir/link.txt
          fi

          # Build everything
          cmake --build build --config Release --parallel $(nproc)
          
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonic3air-arm64-binary
          path: Oxygen/sonic3air/build/_cmake/build/sonic3air
