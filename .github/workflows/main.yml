name: Build ARM64 Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Host Cross-Compiler & Local Headers
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake libcurl4-openssl-dev

    - name: Inject Missing Curl Headers Domestically
      run: |
        # Create the local destination directory structure safely
        mkdir -p Oxygen/oxygenengine/source/framework/external/curl/curl
        
        # Search all active system include locations for the curl header files and copy them over
        find /usr/include -type f -wholename "*/curl/*.h" -exec cp {} Oxygen/oxygenengine/source/framework/external/curl/curl/ \;

    - name: Configure and Build CMake Project
      run: |
        cd Oxygen/sonic3air/build/_cmake
        
        # We pass -DGLEW_NO_GLU directly to the global compiler definition block.
        # This tells the embedded glew.c file to completely skip the GL/glu.h requirement.
        cmake \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DCMAKE_CXX_FLAGS="-DGLEW_NO_GLU" \
          -DCMAKE_C_FLAGS="-DGLEW_NO_GLU" \
          -DOPENGL_opengl_LIBRARY=/dev/null \
          -DOPENGL_glx_LIBRARY=/dev/null \
          -DOPENGL_INCLUDE_DIR=/dev/null \
          -DCURL_LIBRARY=/dev/null \
          -DCURL_INCLUDE_DIR=${{ github.workspace }}/Oxygen/oxygenengine/source/framework/external/curl \
          -DSDL_STATIC=OFF \
          -DUSE_GLES=ON .
          
        make
