name: Build Sonic 3 AIR ARM64 RG34XX

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-arm64:
    name: Build current Sonic 3 AIR ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Clone current upstream Sonic 3 A.I.R.
        uses: actions/checkout@v4
        with:
          repository: Eukaryot/sonic3air
          ref: main
          submodules: recursive
          fetch-depth: 1

      - name: Show source version
        run: |
          grep -E 'BUILD_(NUMBER|VERSION|STRING|VARIANT)' Oxygen/sonic3air/source/sonic3air/version.inc || true

      - name: Patch current upstream ImGui stub
        run: |
          sed -i 's/bool ImGuiIntegration::hasBlockingImGuiWindow()  { return false; }/bool ImGuiIntegration::hasBlockingImGuiWindow() const { return false; }/'             Oxygen/oxygenengine/source/oxygen/menu/imgui/ImGuiIntegration.cpp
          grep -n 'hasBlockingImGuiWindow'             Oxygen/oxygenengine/source/oxygen/menu/imgui/ImGuiIntegration.cpp

      - name: Install PortMaster build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential             cmake             ninja-build             git             pkg-config             libsdl2-dev             libgl1-mesa-dev             libglu1-mesa-dev             libgles2-mesa-dev             libasound2-dev             libpulse-dev             libxcomposite-dev             libxxf86vm-dev             libcurl4-openssl-dev

      - name: Configure using PortMaster recipe
        working-directory: Oxygen/sonic3air/build/_cmake
        run: |
          cmake -G Ninja -B build             -DUSE_GLES=ON             -DBUILD_SDL_STATIC=OFF             -DUSE_DISCORD=OFF             -DUSE_IMGUI=OFF             -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: Oxygen/sonic3air/build/_cmake
        run: |
          cmake --build build --parallel 2

      - name: Strip binary like PortMaster
        run: |
          test -f Oxygen/sonic3air/sonic3air_linux
          strip Oxygen/sonic3air/sonic3air_linux
          file Oxygen/sonic3air/sonic3air_linux

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: sonic3air-current-arm64-portmaster
          path: Oxygen/sonic3air/sonic3air_linux
