name: Build Sonic 3 AIR ARM64 RG34XX
on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ARM64 Multi-Arch and Install Dependencies
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libsdl2-dev:arm64 \
            libgles2-mesa-dev:arm64 \
            libegl1-mesa-dev:arm64 \
            libcurl4-openssl-dev:arm64

      - name: Compile via CMake
        run: |
          cd Oxygen/sonic3air/build/_cmake
          rm -rf build
          
          # Use proper cross-compilation flags matching target multiarch paths
          cmake -B build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -march=armv8-a" \
            -DCMAKE_CXX_FLAGS="-O3 -march=armv8-a" \
            -DUSE_GLES=ON \
            -DBUILD_SDL_STATIC=OFF \
            -DBUILD_OXYGEN_SERVER=OFF \
            -D_THEORA_STATIC=ON \
            -D_VORBIS_STATIC=ON \
            -D_OGG_STATIC=ON
            
          cmake --build build --config Release --parallel $(nproc)

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonic3air-arm64-binary
          path: Oxygen/sonic3air/build/_cmake/build/sonic3air*
