name: Build ARM64 Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up QEMU for ARM64 Emulation
      uses: docker/setup-qemu-action@v3

    - name: Compile inside ARM64 Ubuntu Container
      run: |
        docker run --rm --platform linux/arm64 -v ${{ github.workspace }}:/workspace -w /workspace arm64v8/ubuntu:24.04 bash -c "
          apt-get update && \
          apt-get install -y gcc g++ cmake libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev libsdl2-dev && \
          cd Oxygen/sonic3air/build/_cmake && \
          cmake -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 . && \
          make -j$(nproc)
        "

    - name: Upload Compiled Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sonic3air-linux-arm64
        path: Oxygen/sonic3air/build/_cmake/sonic3air
