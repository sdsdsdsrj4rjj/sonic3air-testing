name: Build ARM64 Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Host Cross-Compiler & Multiarch Headers
      run: |
        sudo apt-get update
        # Install the cross-compiler alongside the precise development headers for Curl and SDL2
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake libcurl4-openssl-dev libsdl2-dev

    - name: Configure and Build CMake Project
      run: |
        cd Oxygen/sonic3air/build/_cmake
        
        # We point include tracking paths directly to our system's active header directories (/usr/include),
        # but map the library file pointers to /dev/null so it links to your custom Anbernic OS runtime libraries.
        cmake \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DOPENGL_opengl_LIBRARY=/dev/null \
          -DOPENGL_glx_LIBRARY=/dev/null \
          -DOPENGL_INCLUDE_DIR=/usr/include \
          -DCURL_LIBRARY=/dev/null \
          -DCURL_INCLUDE_DIR=/usr/include \
          -DSDL_STATIC=OFF \
          -DUSE_GLES=ON .
          
        make -j$(nproc)

    - name: Upload Compiled Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sonic3air-linux-arm64
        path: Oxygen/sonic3air/build/_cmake/sonic3air
