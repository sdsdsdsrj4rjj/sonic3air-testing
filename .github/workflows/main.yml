name: Build Sonic 3 AIR ARM64

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU (ARM64 Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Run Build in Native ARM64 Container
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu_latest
          
          # Pass paths down into our virtual workspace setup
          githubToken: ${{ github.token }}
          
          # Install dependencies natively inside the virtual ARM64 environment
          setup: |
            apt-get update
            apt-get install -y build-essential cmake git libgles2-mesa-dev libegl1-mesa-dev libdrm-dev libgbm-dev

          # Run the actual compile step natively as an ARM64 app
          run: |
            cd Oxygen/sonic3air/build/_cmake
            
            cmake -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_FLAGS="-O3 -march=armv8-a" \
              -DCMAKE_CXX_FLAGS="-O3 -march=armv8-a" \
              -DUSE_GLES=ON \
              -DBUILD_SDL_STATIC=ON
              
            cmake --build build --config Release --parallel $(nproc)

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonic3air-arm64-binary
          path: Oxygen/sonic3air/build/_cmake/build/sonic3air
