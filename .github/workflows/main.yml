name: Build Sonic 3 AIR ARM64 RG34XX
on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Toolchain & Core Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Compile via CMake
        run: |
          cd Oxygen/sonic3air/build/_cmake
          rm -rf build
          
          # Force built-in static media subsystems to prevent cross-compile header hunting errors
          cmake -B build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -march=armv8-a" \
            -DCMAKE_CXX_FLAGS="-O3 -march=armv8-a" \
            -DUSE_GLES=ON \
            -DBUILD_SDL_STATIC=ON \
            -DBUILD_OXYGEN_SERVER=OFF \
            -DOPENGL_FOUND=TRUE \
            -DOPENGL_opengl_LIBRARY="text" \
            -DOPENGL_glx_LIBRARY="text" \
            -DOPENGL_INCLUDE_DIR="/usr/include" \
            -D_THEORA_STATIC=ON \
            -D_VORBIS_STATIC=ON \
            -D_OGG_STATIC=ON
            
          cmake --build build --config Release --parallel $(nproc)

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonic3air-arm64-binary
          path: Oxygen/sonic3air/build/_cmake/build/sonic3air
