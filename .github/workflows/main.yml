name: Build Sonic 3 AIR ARM64 RG34XX

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-arm64:
    name: Build Sonic 3 AIR ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Sonic 3 A.I.R. v26.03.28.0
        uses: actions/checkout@v4
        with:
          repository: Eukaryot/sonic3air
          ref: v26.03.28.0-stable
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libgles2-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libxcomposite-dev \
            libxxf86vm-dev \
            libcurl4-openssl-dev

      - name: Configure
        working-directory: Oxygen/sonic3air/build/_cmake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_DISCORD=OFF \
            -DUSE_GLES=ON \
            -DBUILD_SDL_STATIC=ON \
            -DBUILD_OXYGEN_SERVER=OFF

      - name: Build
        working-directory: Oxygen/sonic3air/build/_cmake
        run: |
          cmake --build build --config Release --parallel

      - name: Verify ARM64 binary
        run: |
          file Oxygen/sonic3air/sonic3air_linux
          chmod +x Oxygen/sonic3air/sonic3air_linux

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: sonic3air-v26.03.28-arm64
          path: Oxygen/sonic3air/sonic3air_linux
